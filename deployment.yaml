apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-o-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dev-o-app
  template:
    metadata:
      labels:
        app: dev-o-app
    spec:
      containers:
      - name: dev-o-app
        image: dev-o-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5